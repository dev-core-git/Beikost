<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Beikost</title>
<meta name="apple-mobile-web-app-title" content="Beikost">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3F7F2E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
:root{
  --bg:#F2F6F0; --surface:#FFFFFF; --surface2:#E9F0E5; --ink:#1E2B22; --muted:#5E6D62; --line:#D9E3D5;
  --pea:#3F7F2E; --pea-soft:#DCEBD2; --beet:#A42D57; --beet-soft:#F6DFE7; --sun:#B9731A; --sun-soft:#FBEBD3;
  --shadow:0 1px 0 rgba(30,43,34,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111712; --surface:#1A221C; --surface2:#222C24; --ink:#E6EEE6; --muted:#98A89C; --line:#2B372E;
    --pea:#8FC874; --pea-soft:#24361F; --beet:#EA85A6; --beet-soft:#3B1F2A; --sun:#F1BC62; --sun-soft:#3A2C16;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111712; --surface:#1A221C; --surface2:#222C24; --ink:#E6EEE6; --muted:#98A89C; --line:#2B372E;
  --pea:#8FC874; --pea-soft:#24361F; --beet:#EA85A6; --beet-soft:#3B1F2A; --sun:#F1BC62; --sun-soft:#3A2C16;
  --shadow:none; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pea);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.15}
p{margin:0}

/* Kopf */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 18px 10px}
.top h1{font-size:28px;font-weight:900;letter-spacing:-.02em;flex:1}
.agechip{background:var(--pea-soft);color:var(--pea);font-weight:800;font-size:14px;border-radius:999px;padding:6px 12px;border:0}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:19px}

main{padding:4px 18px 24px;max-width:720px;margin:0 auto}
.view{display:none}.view.on{display:block}

/* Tab-Leiste */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;font-size:11px;font-weight:700;color:var(--muted);border-radius:12px}
.tabs button span{font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.7}
.tabs button.on{color:var(--pea)}
.tabs button.on span{filter:none;opacity:1}

/* Bausteine */
.sec{margin:22px 0 10px;font-size:19px;font-weight:900}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:800;background:var(--pea);color:var(--surface)}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.warn{background:var(--beet-soft);color:var(--beet)}
.btn.full{width:100%}
.row{display:flex;gap:10px;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=text],input[type=date],input[type=search],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 13px;font-size:16px}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-weight:800;font-size:14px;margin:14px 0 6px}
.switch{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;color:var(--muted)}
.switch input{width:20px;height:20px;accent-color:var(--pea)}

/* Heute */
.hero{background:var(--pea);color:var(--surface);border-radius:22px;padding:20px 20px 18px;position:relative;overflow:hidden}
.hero .big{font-size:64px;font-weight:900;line-height:.9;letter-spacing:-.04em}
.hero .unit{font-size:18px;font-weight:800;opacity:.9}
.hero p{margin-top:10px;font-weight:600;opacity:.95;max-width:34ch}
.hero .spoon{position:absolute;right:-14px;bottom:-18px;font-size:110px;opacity:.18;transform:rotate(-18deg)}
.setup{background:var(--surface);border:2px dashed var(--line);border-radius:20px;padding:18px}

/* Lebensmittel-Liste */
.food{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;text-align:left}
.food+.food{margin-top:8px}
.food .em{font-size:28px;width:36px;text-align:center}
.food .nm{font-weight:800}
.food .sub{font-size:13px;color:var(--muted)}
.food .mid{flex:1;min-width:0}
.mo{flex:none;min-width:52px;text-align:center;border-radius:12px;padding:6px 4px;font-weight:900;font-size:17px;line-height:1;background:var(--pea-soft);color:var(--pea)}
.mo small{display:block;font-size:10px;font-weight:800;margin-top:2px;opacity:.85}
.mo.later{background:var(--sun-soft);color:var(--sun)}
.mo.no{background:var(--beet-soft);color:var(--beet)}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px;background:var(--beet-soft);color:var(--beet)}
.tick{font-size:12px;font-weight:800;color:var(--pea)}

/* Stufenleiste */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:14px 0 4px}
.strip div{border-radius:8px;padding:8px 6px;font-size:12px;font-weight:800;text-align:center;background:var(--surface2);color:var(--muted)}
.strip div.ok{background:var(--pea-soft);color:var(--pea)}
.strip div.now{outline:2.5px solid var(--pea);outline-offset:-2.5px}
.strip div.off{background:repeating-linear-gradient(135deg,var(--surface2) 0 6px,transparent 6px 12px);opacity:.8}
.stage{border-left:4px solid var(--pea);padding:4px 0 4px 12px;margin-top:12px}
.stage.off{border-color:var(--line)}
.stage b{display:block;font-size:14px}
.warnbox{background:var(--beet-soft);color:var(--beet);border-radius:12px;padding:12px;font-weight:700;font-size:14px;margin-top:14px}
.infobox{background:var(--surface2);border-radius:12px;padding:12px;font-size:14px;margin-top:14px}

/* Rezepte */
.rec{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.rec+.rec{margin-top:10px}
.rec h3{font-size:17px;font-weight:900}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.meta span{font-size:12px;font-weight:800;background:var(--surface2);border-radius:999px;padding:3px 9px;color:var(--muted)}
ol.steps{padding-left:22px;margin:8px 0 0}
ol.steps li{margin:6px 0}
ul.ing{list-style:none;padding:0;margin:8px 0 0}
ul.ing li{padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
ul.ing li b{min-width:74px}

.thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--surface2);flex:none}
.hero-img{width:100%;max-height:260px;object-fit:cover;border-radius:16px;margin:4px 0 12px;display:block;background:var(--surface2)}
.tag.own{background:var(--pea-soft);color:var(--pea)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.btn{display:block;cursor:pointer}

/* Zeichnungen */
.sketchwrap{margin:2px -4px 14px}
.sketch{width:100%;height:auto;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.12))}
svg.thumb{background:#FFFDF6;border:1px solid #E6DFD2}
.ing .no{display:inline-grid;place-items:center;flex:none;width:22px;height:22px;border-radius:50%;background:#F6C9C1;color:#B24A3A;font-weight:900;font-size:12px}
.forms{display:flex;gap:8px;margin:8px 0 6px;flex-wrap:wrap}
.form{width:84px;background:#FFFDF6;border:1px solid #E6DFD2;border-radius:12px;padding:4px 4px 6px;text-align:center}
.form svg{width:100%;height:auto;display:block}
.form span{display:block;font-family:Noteworthy,'Chalkboard SE','Comic Sans MS',cursive;font-size:12px;line-height:1.15;color:#3b342e}
.stage.cur{background:var(--pea-soft);border-radius:0 12px 12px 0;padding-right:10px}
ul.ideas{margin:8px 0 0;padding-left:20px}
ul.ideas li{margin:6px 0}
.rchips{display:flex;gap:10px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.rchips::-webkit-scrollbar{display:none}
.rchip{flex:none;width:118px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px;text-align:left}
.rchip svg.thumb{width:100%;height:64px;border-radius:10px}
.rchip span{display:block;font-weight:800;font-size:13px;line-height:1.2;margin-top:6px}
.rchip small{color:var(--muted);font-size:11px;font-weight:700}

/* Tagebuch */
.day{font-weight:900;font-size:15px;margin:18px 0 8px;color:var(--muted)}
.entry{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.entry+.entry{margin-top:8px}
.entry .re{font-size:26px}
.entry .x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:18px;padding:2px 6px}
.symp{color:var(--beet);font-weight:800;font-size:13px}
.react{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.react button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 4px;font-weight:800;font-size:13px}
.react button span{display:block;font-size:26px}
.react button.on{border-color:var(--pea);background:var(--pea-soft);color:var(--pea)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:14px;font-weight:700;background:var(--surface)}
.checks input{accent-color:var(--beet)}
.empty{text-align:center;padding:28px 10px;color:var(--muted)}
.empty .e{font-size:44px}

/* Allergene */
.al{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.al+.al{margin-top:8px}
.al .em{font-size:26px}
.al .st{margin-left:auto;font-size:12px;font-weight:900;border-radius:999px;padding:4px 10px;white-space:nowrap}
.st.new{background:var(--surface2);color:var(--muted)}
.st.due{background:var(--sun-soft);color:var(--sun)}
.st.ok{background:var(--pea-soft);color:var(--pea)}
.st.bad{background:var(--beet-soft);color:var(--beet)}

/* Notfall */
.sos{background:var(--beet);color:#fff;border-radius:20px;padding:18px}
.sos h2{font-size:24px;font-weight:900}
.sos a{color:#fff}
.call{display:block;text-align:center;background:#fff;color:var(--beet) !important;font-weight:900;font-size:22px;border-radius:14px;padding:12px;margin-top:12px;text-decoration:none}
ol.big{padding-left:0;list-style:none;counter-reset:s;margin:12px 0 0}
ol.big li{counter-increment:s;display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
ol.big li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--beet);color:#fff;font-weight:900;display:grid;place-items:center}

/* Mehr-Menü */
.menu{display:flex;align-items:center;gap:14px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;font-weight:800}
.menu+.menu{margin-top:8px}
.menu span{font-size:24px}
.menu small{display:block;font-weight:600;color:var(--muted)}

/* Blatt (Modal) */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:24px 24px 0 0;max-height:92%;overflow-y:auto;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .28s ease;max-width:720px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet .hd{display:flex;align-items:center;gap:12px}
.sheet .hd .em{font-size:44px}
.sheet .hd h2{font-size:26px;font-weight:900;flex:1}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;font-weight:800;font-size:14px;z-index:60;display:none}
.disc{font-size:12px;color:var(--muted);text-align:center;margin:26px 8px 0}
</style>
</head>
<body>

<header class="top">
  <h1>Beikost</h1>
  <button class="agechip" id="ageChip" hidden></button>
  <button class="iconbtn" id="themeBtn" aria-label="Hell oder dunkel umschalten">🌙</button>
</header>

<main>
  <section class="view on" id="v-heute"></section>
  <section class="view" id="v-essen"></section>
  <section class="view" id="v-rezepte"></section>
  <section class="view" id="v-buch"></section>
  <section class="view" id="v-mehr"></section>
</main>

<nav class="tabs" id="tabs">
  <button data-v="heute" class="on"><span>🏠</span>Heute</button>
  <button data-v="essen"><span>🥕</span>Lebensmittel</button>
  <button data-v="rezepte"><span>🥣</span>Rezepte</button>
  <button data-v="buch"><span>📒</span>Tagebuch</button>
  <button data-v="mehr"><span>☰</span>Mehr</button>
</nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Daten: Lebensmittel ----------
 m = ab ca. Monaten (Alter), null = meiden
 p = [Einstieg bis 8 Mon, 9–12 Mon, ab 12 Mon]
 a = Allergen-Schlüssel */
const CATS=["Gemüse","Obst","Getreide","Hülsenfrüchte & Soja","Nüsse & Samen","Fleisch & Fisch","Ei & Milch","Erst später / meiden"];
const FOODS=[
// Gemüse
{e:"🥕",n:"Karotte",k:0,m:5,p:["Gedämpft und fein püriert. Als Fingerfood: weich gegarte Sticks, finger­lang und -dick.","Weich gegarte Würfel oder Scheiben, roh nur sehr fein gerieben.","Gegart in Stücken; roh weiterhin fein geraspelt."],z:"Schälen, in Stücke schneiden, 10–15 Min. dämpfen bis sie sich mit der Gabel leicht zerdrücken lässt.",w:"Rohe Karottenstücke sind hart – Erstickungsgefahr. Roh nur gerieben geben."},
{e:"🥔",n:"Kartoffel",k:0,m:5,p:["Gekocht und püriert oder zerdrückt im Brei; Ofen-Sticks weich gebacken.","Kleine weiche Würfel, Kartoffelstampf.","Wie Familienkost, ohne Salz für das Baby."],z:"Mehligkochende Sorten werden besonders weich. Grüne Stellen und Keime großzügig entfernen.",w:""},
{e:"🍠",n:"Süßkartoffel",k:0,m:5,p:["Püriert oder als weiche Ofen-Spalten.","Weiche Würfel, Stampf.","Wie Familienkost."],z:"Mit Schale im Ofen bei 200 °C ca. 25 Min. backen oder schälen und dämpfen.",w:""},
{e:"🎃",n:"Kürbis (Hokkaido)",k:0,m:5,p:["Gedämpft püriert oder weiche Ofenspalten.","Weiche Würfel.","Wie Familienkost."],z:"Hokkaido kann mit Schale gegart werden, für den Brei aber die Schale entfernen oder sehr fein pürieren.",w:""},
{e:"🥕",n:"Pastinake",k:0,m:5,p:["Gedämpft und püriert – milder Klassiker für den ersten Brei. Weiche Sticks.","Weiche Würfel.","Gegart in Stücken."],z:"Schälen, in Scheiben schneiden, ca. 12 Min. dämpfen.",w:"Roh hart – nur gegart geben."},
{e:"🥒",n:"Zucchini",k:0,m:5,p:["Gedämpft püriert oder weiche Sticks mit Schale (Schale hilft beim Greifen).","Weiche Würfel oder Scheiben.","Gegart oder roh geraspelt."],z:"Waschen, in Sticks schneiden, 5–8 Min. dämpfen.",w:""},
{e:"🥦",n:"Brokkoli",k:0,m:5,p:["Püriert oder große Röschen mit Stiel als Griff, weich gedämpft.","Kleine weiche Röschen.","Wie Familienkost."],z:"Röschen 6–8 Min. dämpfen, bis sie weich, aber nicht zerfallen sind.",w:"Kann blähen – anfangs kleine Mengen."},
{e:"🥬",n:"Blumenkohl",k:0,m:5,p:["Püriert oder große weiche Röschen.","Kleine weiche Röschen.","Wie Familienkost."],z:"8–10 Min. dämpfen.",w:"Kann blähen – anfangs kleine Mengen."},
{e:"🌿",n:"Fenchel",k:0,m:5,p:["Gedämpft und fein püriert.","Weich gegarte kleine Stücke.","Gegart oder fein geschnitten."],z:"Harten Strunk entfernen, in Streifen dämpfen.",w:""},
{e:"🫛",n:"Erbsen",k:0,m:6,p:["Gekocht und fein püriert.","Zerdrückt (flach gedrückt) zum Selbstgreifen.","Ganz, gut gegart."],z:"TK-Erbsen 5 Min. kochen.",w:"Ganze runde Erbsen erst mit sicherem Kauen – vorher zerdrücken."},
{e:"🥬",n:"Spinat",k:0,m:6,p:["Frisch gekocht, fein püriert, in Brei oder Omelett.","Gehackt in Pfannkuchen, Omelett, Nudeln.","Wie Familienkost."],z:"Blanchieren und fein hacken oder pürieren.",w:"Wegen Nitrat nicht warmhalten und kein zweites Mal aufwärmen. Reste schnell kühlen."},
{e:"🟣",n:"Rote Bete",k:0,m:6,p:["Gegart, püriert oder weiche Sticks.","Kleine weiche Würfel.","Gegart oder roh fein gerieben."],z:"Vorgegarte Rote Bete ohne Essig verwenden oder selbst 40 Min. kochen.",w:"Färbt Stuhl und Urin rötlich – harmlos. Enthält viel Nitrat, daher nicht täglich."},
{e:"🥒",n:"Gurke",k:0,m:6,p:["Große, dicke Sticks zum Lutschen (gekühlt gut beim Zahnen).","Dünne Scheiben oder kleine Würfel.","Wie Familienkost."],z:"Waschen, teils schälen, längs in dicke Sticks schneiden.",w:"Nur große Sticks oder sehr kleine Stücke – keine mundgerechten harten Scheiben am Anfang."},
{e:"🍅",n:"Tomate",k:0,m:6,p:["Gehäutet und püriert, als Soße.","Kirschtomaten immer längs vierteln.","Kirschtomaten weiter vierteln."],z:"Kreuzweise einritzen, kurz überbrühen, Haut abziehen.",w:"Kirschtomaten nie ganz geben (bis ca. 4 Jahre vierteln). Säure kann Rötungen um den Mund machen."},
{e:"🫑",n:"Paprika",k:0,m:6,p:["Gegart und püriert oder weich gebackene Streifen.","Weiche Streifen, Haut ggf. abziehen.","Roh in dünnen Streifen."],z:"Im Ofen rösten, dann lässt sich die Haut leicht abziehen.",w:"Rohe Paprikahaut ist zäh – anfangs nur gegart."},
{e:"🫘",n:"Grüne Bohnen",k:0,m:6,p:["Gut gegart, püriert oder ganze weiche Bohnen.","Weiche Stücke.","Wie Familienkost."],z:"Enden abschneiden, 10–12 Min. kochen.",w:"Nie roh – rohe Bohnen sind giftig."},
{e:"🍆",n:"Aubergine",k:0,m:6,p:["Gebacken, Fruchtfleisch zerdrückt.","Weiche Würfel.","Wie Familienkost."],z:"Halbieren, im Ofen weich backen, Fruchtfleisch auslöffeln.",w:""},
{e:"🥑",n:"Avocado",k:0,m:5,p:["Zerdrückt oder reife Spalten (in gemahlenen Haferflocken wälzen, dann rutschen sie nicht).","Würfel.","Wie Familienkost."],z:"Nur sehr reife, weiche Avocado verwenden.",w:""},
{e:"🍄",n:"Champignons",k:0,m:8,p:["Gut gegart und fein gehackt im Brei.","Gegarte, fein geschnittene Stücke.","Wie Familienkost."],z:"Immer durchgaren.",w:"Nicht roh geben. Wildpilze im Kleinkindalter meiden."},

/* ---------- Zustand & Speicher ---------- */
const LS="beikost-v1";
let state={birth:"",theme:"",diary:[],recipes:[],del:[],updated:0};
try{const s=JSON.parse(localStorage.getItem(LS)||"null");if(s)state=Object.assign(state,s)}catch(e){}
let remote=null, saveTimer=null;

function save(){
  state.updated=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    if(!remote)return;
    try{await remote.set(JSON.parse(JSON.stringify(state)))}catch(e){}
  },700);
}
(async function connect(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const uid=await user.id(); if(!uid)return;
    const ref=db.doc("data/users/"+uid+"/beikost");
    const snap=await ref.get();
    if(snap.exists){
      const d=snap.data();
      if((d.updated||0)>(state.updated||0)){state=Object.assign({birth:"",theme:"",diary:[],recipes:[],del:[],updated:0},d);try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){};applyTheme();renderAll()}
    }
    remote=ref;
    photoRef=id=>ref.collection("photos").doc(id);
    flushPhotos();
    if(!snap.exists&&(state.diary.length||state.birth||state.recipes.length))save();
  }catch(e){}
})();

/* ---------- Helfer ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
function ageMonths(){
  if(!state.birth)return null;
  const b=new Date(state.birth+"T00:00:00"),n=new Date();
  let m=(n.getFullYear()-b.getFullYear())*12+(n.getMonth()-b.getMonth());
  if(n.getDate()<b.getDate())m--;
  return Math.max(0,m);
}
function ageWeeksExtra(){
  const b=new Date(state.birth+"T00:00:00"),n=new Date();const m=ageMonths();
  const t=new Date(b);t.setMonth(t.getMonth()+m);return Math.floor((n-t)/(7*864e5));
}
function stageIdx(m){return m==null?-1:m<9?0:m<12?1:2}
function fmtDate(iso){const d=new Date(iso+"T00:00:00");return d.toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"long"})}
function daysSince(iso){return Math.floor((new Date(todayISO()+"T00:00:00")-new Date(iso+"T00:00:00"))/864e5)}
function toast(t){const el=$("#toast");el.textContent=t;el.style.display="block";clearTimeout(el._t);el._t=setTimeout(()=>el.style.display="none",1800)}
const foodBy=n=>FOODS.find(f=>f.n===n);
function triedCount(n){return state.diary.filter(d=>d.f===n).length}
function moBadge(f){
  if(f.m==null)return `<div class="mo no">✕<small>meiden</small></div>`;
  if(f.m>=24)return `<div class="mo no">${Math.round(f.m/12)} J<small>frühestens</small></div>`;
  const a=ageMonths();const later=a!=null&&f.m>a;
  return `<div class="mo ${later?"later":f.m>=12?"later":""}">${f.m}+<small>Monate</small></div>`;
}

const LINECOL=new Set(["#3b342e","#7DB35F","#8a6a3a","#6b4b2a","#E07A5F","#C9A040","#5b4a2a"]);
const P=(d,f="none",w=2.2)=>{const line=LINECOL.has(f)&&!/Z\s*$/i.test(d);return `<path d="${d}" fill="${line?"none":f}" stroke="${line?f:INK}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`};
const Cc=(x,y,r,f="none",w=2.2)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" stroke="${INK}" stroke-width="${w}"/>`;
const El=(x,y,rx,ry,f="none",w=2.2,rot=0)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}" stroke="${INK}" stroke-width="${w}"${rot?` transform="rotate(${rot} ${x} ${y})"`:""}/>`;
const Rc=(x,y,w,h,r,f="none",sw=2.2)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}" stroke="${INK}" stroke-width="${sw}"/>`;
const Tx=(x,y,t,s=14,o={})=>`<text x="${x}" y="${y}" font-family="${HAND}" font-size="${s}" fill="${o.c||INK}" text-anchor="${o.a||"middle"}"${o.w?` font-weight="${o.w}"`:""}${o.r?` transform="rotate(${o.r} ${x} ${y})"`:""}>${esc(t)}</text>`;
const G=(x,y,inner,s=1,r=0)=>`<g transform="translate(${x} ${y})${r?` rotate(${r})`:""}${s!==1?` scale(${s})`:""}">${inner}</g>`;

function iconFor(name,amount){
 const n=(" "+name+" ").toLowerCase();
 let key="blob:"+name.split(" ")[0].slice(0,9);
 for(const [re,k] of ICON_RULES){if(re.test(n)){key=k;break}}
 if(/seelachs/.test(n))key="whitefish";
 const [k,a,b]=key.split(":");
 const f=ICONS[k]||ICONS.blob;
 if(k==="egg"){const c=parseInt(amount)||1;return f(c)}
 return f(a,b);
}

function colorFor(r){
 for(const [,n] of r.i){const s=(" "+n+" ").toLowerCase();for(const [re,k] of ICON_RULES){if(re.test(s)){const c=ICON_COLOR[k.split(":")[0]];if(c)return c;break}}}

}

function guessTool(r){
 const t=((r.s||[]).join(" ")+" "+r.n).toLowerCase();
 if(r.tool)return r.tool;
 if(/waffel/.test(t))return "waffle";
 if(/über nacht|kühlschrank stellen|einfrieren/.test(t)&&!/koch/.test(t))return "cool";
 if(/ofen|backen|backblech/.test(t)&&!/pfanne/.test(t))return "oven";
 if(/pfanne|braten|ausbacken/.test(t))return "pan";
 if(/pürier|mixen|mixer/.test(t))return "puree";
 if(/dämpf/.test(t))return "steam";
 if(/zerdrück/.test(t)&&!/koch/.test(t))return "fork";
 if(/koch|köchel|garen|quellen|aufkochen/.test(t))return "cook";
 return "mix";
}
function guessDish(r){
 if(r.dish)return r.dish;
 const n=r.n.toLowerCase();
 if(/waffel/.test(n))return "waffles";
 if(/pancake|pfannkuchen/.test(n))return "pancakes";
 if(/muffin/.test(n))return "muffins";
 if(/taler|puffer|kekse|cookie|plätzchen/.test(n))return "discs";
 if(/bällchen|frikadell|klößchen/.test(n))return "balls";
 if(/pommes|sticks|stäbchen|schnitten/.test(n))return "sticks";
 if(/streifen|toast/.test(n))return "strips";
 if(/spalten|ofengemüse/.test(n))return "wedges";
 if(/nudel|pasta|spaghetti|bolognese|lasagne/.test(n))return "pasta";
 if(/suppe/.test(n))return "soup";
 if(/rührei|omelett/.test(n))return "eggs";
 if(/brei|mus\b|hummus|dal/.test(n)||r.typ==="Brei")return "mash";
 return "porridge";
}
function shortName(s){s=s.replace(/\(.*?\)/g,"").replace(/,.*$/,"").trim();const w=s.split(/\s+/);let o=w[0];if(w[1]&&(o+" "+w[1]).length<=13)o+=" "+w[1];return o.length>13?o.slice(0,12)+"…":o}
function arrow(x1,y1,x2,y2,bend=.18){
 const mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1;
 const cx=mx-dy*bend,cy=my+dx*bend;
 const ang=Math.atan2(y2-cy,x2-cx),a1=ang+Math.PI-0.45,a2=ang+Math.PI+0.45;
 const h=9;
 return P(`M${x1},${y1} Q${cx},${cy} ${x2},${y2}`,"none",1.9)+P(`M${x2+h*Math.cos(a1)},${y2+h*Math.sin(a1)} L${x2},${y2} L${x2+h*Math.cos(a2)},${y2+h*Math.sin(a2)}`,"none",1.9);
}

 });

 const title=r.n.length>22?r.n.replace(/-/g,"- ").split(" "):null;

 const ab=r.m?Tx(326,30,"ab "+r.m+" M.",12,{c:"#8a7f73",r:12}):"";
 return `<svg viewBox="0 0 ${W} ${H}" class="sketch" role="img" aria-label="Zeichnung: ${esc(r.n)}">

}

function prepOf(f){return PREP[f.n]||{}}
function foodColor(f){return prepOf(f).c||["#F4A04A","#E2533A","#E9D3A0","#E3C98A","#C98B54","#D86A6A","#F6D55C","#CCCCCC"][f.k]}
function foodRegex(f){
 const p=prepOf(f);
 if(p.k)return new RegExp(p.k,"i");
 const w=f.n.split(/[\s/(]/)[0].toLowerCase();
 const stem=w.length>=6?w.slice(0,5):w;
 return new RegExp("(^|[^a-zäöüß])"+stem,"i");
}
function recipesWith(f){const re=foodRegex(f);return allRecipes().filter(r=>(r.i||[]).some(x=>re.test(" "+x[1])))}

function stageTip(m){
  if(m<4)return "Noch keine Beikost – Muttermilch oder Säuglingsnahrung reicht. Beikost startet frühestens mit Beginn des 5. Lebensmonats.";
  if(m<5)return "Achte auf Reifezeichen: aufrecht sitzen mit Hilfe, Kopf halten, Interesse am Essen, Zungenstoßreflex lässt nach.";
  if(m<6)return "Zeit für den ersten Mittagsbrei: mit wenigen Löffeln Gemüse starten, dann Kartoffel, dann Fleisch dazu.";
  if(m<7)return "Wenn der Mittagsbrei klappt: etwa einen Monat später abends den Milch-Getreide-Brei einführen.";
  if(m<9)return "Dritter Brei am Nachmittag (Getreide-Obst). Fingerfood darf jetzt immer mehr mitmischen. Wasser aus dem Becher anbieten.";
  if(m<10)return "Pinzettengriff kommt: kleine weiche Stücke üben. Ab jetzt stückiger werden.";
  if(m<12)return "Nach und nach am Familientisch mitessen – ungewürzt Portion abnehmen.";
  return "Familienkost! Salz und Zucker weiter sparsam, ganze Nüsse und runde harte Stücke weiter meiden.";
}

let fCat=-1,fQuery="",fAge=false;
function foodRow(f){
  const c=triedCount(f.n);
  const al=f.a?ALLERGENS.find(x=>x.k===f.a):null;
  return `<button class="food" data-food="${esc(f.n)}">
    <div class="em">${f.e}</div>

    <div class="sub">${esc(CATS[f.k])}${c?` · <span class="tick">✓ ${c}× probiert</span>`:""}</div></div>
    ${moBadge(f)}</button>`;

function renderFoods(){
  const el=$("#v-essen");const a=ageMonths();
  el.innerHTML=`<input type="search" id="fq" placeholder="Lebensmittel suchen …" value="${esc(fQuery)}">
    <div class="chips" style="margin-top:10px" id="fc">
      <button class="chip ${fCat<0?"on":""}" data-c="-1">Alle</button>
      ${CATS.map((c,i)=>`<button class="chip ${fCat===i?"on":""}" data-c="${i}">${esc(c)}</button>`).join("")}
    </div>
    ${a!=null?`<label class="switch"><input type="checkbox" id="fa" ${fAge?"checked":""}> Nur was mit ${a} Monaten passt</label>`:""}
    <div id="fl" style="margin-top:12px"></div>`;
  const list=()=>{
    const q=fQuery.trim().toLowerCase();
    let L=FOODS.filter(f=>(fCat<0||f.k===fCat)&&(!q||f.n.toLowerCase().includes(q)));
    if(fAge&&a!=null)L=L.filter(f=>f.m!=null&&f.m<=a);
    L.sort((x,y)=>(x.m??99)-(y.m??99)||x.n.localeCompare(y.n,"de"));
    $("#fl").innerHTML=L.length?L.map(foodRow).join(""):`<div class="empty"><div class="e">🔍</div>Nichts gefunden. Anderen Begriff versuchen.</div>`;
  };
  list();
  $("#fq").oninput=e=>{fQuery=e.target.value;list()};
  $("#fc").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;fCat=+b.dataset.c;renderFoods()};
  const fa=$("#fa");if(fa)fa.onchange=e=>{fAge=e.target.checked;list()};
  $("#fl").onclick=e=>{const f=e.target.closest("[data-food]");if(f)showFood(f.dataset.food)};
}
function showFood(name){
  const f=foodBy(name);if(!f)return;
  const a=ageMonths(),cur=stageIdx(a),start=stageIdx(f.m);
  const labels=["Einstieg bis 8 Mon.","9–12 Monate","ab 12 Monaten"];
  const al=f.a?ALLERGENS.find(x=>x.k===f.a):null;
  const c=triedCount(f.n),col=foodColor(f),pr=prepOf(f);
  let strip="",stages="";
  if(f.m!=null&&f.m<24){
    strip=`<div class="strip">${labels.map((l,i)=>`<div class="${i>=start&&f.p[i]?"ok":"off"} ${i===cur?"now":""}">${l}</div>`).join("")}</div>
      ${a!=null?`<p class="small muted">Umrandet: das aktuelle Alter deines Babys (${a} Mon.)</p>`:""}`;
    stages=labels.map((l,i)=>{
      if(!f.p[i])return "";
      const fm=formsFor(f.p[i]);
      return `<div class="stage${i===cur?" cur":""}"><b>${l}</b>${fm.length?`<div class="forms">${fm.map(x=>formCard(x,col)).join("")}</div>`:""}${esc(f.p[i])}</div>`;
    }).join("");
  }
  const recs=f.k!==7?recipesWith(f):[];
  openSheet(`<div class="hd"><div class="em">${f.e}</div><h2>${esc(f.n)}</h2>${moBadge(f)}</div>
    <p class="muted small" style="margin-top:6px">${esc(CATS[f.k])}${al?` · Allergen: <b style="color:var(--beet)">${esc(al.n)}</b>`:""}${c?` · ✓ ${c}× probiert`:""}</p>
    ${strip}${stages}
    ${pr.x&&pr.x.length?`<h3 class="sec" style="font-size:17px">Zubereitungsideen</h3><ul class="ideas">${pr.x.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}
    ${f.z?`<div class="infobox"><b>So bereitest du es vor</b><br>${esc(f.z)}</div>`:""}
    ${f.w?`<div class="warnbox">⚠️ ${esc(f.w)}</div>`:""}
    ${recs.length?`<h3 class="sec" style="font-size:17px">In diesen Rezepten</h3><div class="rchips">${recs.map(r=>`<button class="rchip" data-rid="${esc(r.id)}">${dishThumb(r)}<span>${esc(r.n)}</span><small>ab ${r.m||"?"} Mon.</small></button>`).join("")}</div>`:""}
    <div class="row" style="margin-top:16px">
      ${f.m!=null&&f.k!==7?`<button class="btn full" id="toDiary">Ins Tagebuch</button>`:""}
      <button class="btn ghost full" id="closeS">Schließen</button>
    </div>`);
  $("#closeS").onclick=closeSheet;
  const t=$("#toDiary");if(t)t.onclick=()=>addEntry(f.n);
  $("#sheet").querySelectorAll("[data-rid]").forEach(b=>b.onclick=()=>showRecipe(b.dataset.rid));
}

function allRecipes(){return [...RECIPES.map((r,i)=>({...r,id:"b"+i})),...(state.recipes||[]).map(r=>({...r,own:true}))]}

   ${r.s&&r.s.length?`<h3 class="sec" style="font-size:17px">So geht's</h3><ol class="steps">${r.s.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:""}
   ${r.own?"":`<div class="infobox">${r.m&&r.m>=10?"Reste abgedeckt 1–2 Tage im Kühlschrank oder portioniert einfrieren.":"Brei hält sich abgedeckt 1 Tag im Kühlschrank oder portioniert ca. 3 Monate eingefroren."} Nur einmal aufwärmen.</div>`}
   ${r.own?`<div class="row" style="margin-top:16px"><button class="btn ghost full" id="rEdit">✏️ Bearbeiten</button><button class="btn warn full" id="rDel">Löschen</button></div>`:""}
   <button class="btn ghost full" style="margin-top:10px" id="closeS">Schließen</button>`);
  $("#closeS").onclick=closeSheet;

  }

const phKey=id=>"beikost-photo-"+id;
function savePhoto(id,url){
  photoCache[id]=url;
  try{localStorage.setItem(phKey(id),url)}catch(e){}
  if(photoRef)photoRef(id).set({img:url}).catch(()=>pendingPhotos.add(id));else pendingPhotos.add(id);
}
async function loadPhoto(id){
  if(photoCache[id])return photoCache[id];
  try{const v=localStorage.getItem(phKey(id));if(v)return photoCache[id]=v}catch(e){}
  if(photoRef){try{const sn=await photoRef(id).get();if(sn.exists){const u=sn.data().img;photoCache[id]=u;try{localStorage.setItem(phKey(id),u)}catch(e){}return u}}catch(e){}}
  return null;
}
function deletePhoto(id){
  delete photoCache[id];pendingPhotos.delete(id);
  try{localStorage.removeItem(phKey(id))}catch(e){}
  if(photoRef)photoRef(id).delete().catch(()=>{});
}
function flushPhotos(){pendingPhotos.forEach(id=>{const u=photoCache[id]||(()=>{try{return localStorage.getItem(phKey(id))}catch(e){return null}})();if(u&&photoRef)photoRef(id).set({img:u}).then(()=>pendingPhotos.delete(id)).catch(()=>{})})}
function compressImage(file){
  return new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{
      let max=900,q=.72,out="";
      for(let k=0;k<5;k++){
        const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
        const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        out=c.toDataURL("image/jpeg",q);
        if(out.length<200000)break;
        max=Math.round(max*.8);q=Math.max(.45,q-.08);
      }
      URL.revokeObjectURL(u);res(out);
    };
    img.onerror=()=>{URL.revokeObjectURL(u);rej()};
    img.src=u;
  });
}

/* Zutatenzeile in Menge + Zutat aufteilen */
const UNIT="(?:g|kg|mg|ml|l|cl|dl|EL|TL|Tasse[n]?|Prise[n]?|Msp\\.?|Stk\\.?|Stück|Handvoll|Bund|Pck\\.?|Päckchen|Becher|Scheibe[n]?|Zehe[n]?|Dose[n]?|Glas|Schuss)";
const NUM="(?:ca\\.\\s*|etwa\\s*)?[\\d½¼¾⅓⅔][\\d.,/½¼¾⅓⅔\\s–-]*";
const reFront=new RegExp("^("+NUM+"\\s*"+UNIT+"?\\.?)\\s+(.+)$","i");
const reBack=new RegExp("^(.+?)[,:]?\\s+("+NUM+"\\s*"+UNIT+"\\.?)$","i");
const reWord=new RegExp("^((?:eine?|einen|etwas|1\\/2)\\s+"+UNIT+"?\\.?)\\s+(.+)$","i");
const BULLET=/^([•\-–*·▪◦●]\s*|\d{1,2}[.)]\s+)/;
function splitIng(l){
  l=l.replace(BULLET,"").trim();let m;
  if((m=l.match(reFront)))return [m[1].trim(),m[2].trim()];
  if((m=l.match(reBack)))return [m[2].trim(),m[1].trim()];
  if((m=l.match(reWord)))return [m[1].trim(),m[2].trim()];
  return ["",l];
}
function looksIng(l){
  if(l.length>70)return false;
  return /^([\d½¼¾⅓⅔]|ca\.|etwa\s|eine?\s|einen\s|prise|handvoll|n\.\s?b\.|nach belieben)/i.test(l)||new RegExp("\\b\\d+\\s?"+UNIT+"\\b","i").test(l);
}

/* Rezepttext automatisch aufteilen – läuft komplett auf dem Gerät */
function parseRecipe(txt){
  const lines=txt.replace(/\r/g,"").split("\n").map(l=>l.replace(/\s+/g," ").trim()).filter(Boolean);
  const r={n:"",m:null,t:null,d:"",i:[],s:[],typ:"Brei"};
  const HI=/^(zutaten|für\s+\d|das brauchst du|einkaufsliste|ingredients)\b/i;
  const HS=/^(zubereitung|so geht'?s|so wird'?s gemacht|anleitung|schritte|arbeitsschritte|und so geht'?s|method|instructions)\b/i;
  const META=/^(zubereitungszeit|arbeitszeit|kochzeit|backzeit|gesamtzeit|zeit|dauer|portion|ergibt|schwierigkeit|kalorien)\b/i;
  const all=lines.join(" ");
  let mm=all.match(/ab\s*(?:dem\s*)?(?:ca\.\s*)?(\d{1,2})\.?\s*(?:lebens)?mon/i);if(mm)r.m=+mm[1];
  const tl=lines.find(l=>/(zeit|dauer)/i.test(l)&&/\d+\s*min/i.test(l));if(tl)r.t=+tl.match(/(\d+)\s*min/i)[1];
  if(/finger|sticks|taler|pancake|bällchen|muffin/i.test(all))r.typ="Fingerfood";
  else if(/porridge|frühstück|müsli/i.test(all))r.typ="Frühstück";
  let mode=null;
  const addStep=(l,forceNew)=>{
    const numbered=/^\d{1,2}[.)]\s+/.test(l)||/^[•\-–*·▪◦●]\s*/.test(l);
    const c=l.replace(BULLET,"").trim();if(!c)return;
    const prev=r.s[r.s.length-1];
    if(!prev||numbered||forceNew||/[.!?:]$/.test(prev))r.s.push(c);else r.s[r.s.length-1]=prev+" "+c;
  };
  lines.forEach((l,k)=>{
    if(!r.n&&k===0&&!HI.test(l)&&!HS.test(l)&&!looksIng(l)){r.n=l.replace(/[:.]$/,"");return}
    if(HI.test(l)){mode="i";const rest=l.replace(HI,"").replace(/^[^:]*:?/,"").trim();return}
    if(HS.test(l)){mode="s";return}
    if(META.test(l)||/^ab\s*\d{1,2}\.?\s*(lebens)?mon/i.test(l))return;
    const c=l.replace(BULLET,"").trim();
    if(mode==="i"){
      if(looksIng(c)||c.length<45)r.i.push(splitIng(c));else{mode="s";addStep(l,true)}
    }else if(mode==="s")addStep(l);
    else{
      if(looksIng(c))r.i.push(splitIng(c));
      else if(!r.i.length&&!r.s.length&&!r.d&&c.length<140)r.d=c;
      else addStep(l);
    }
  });
  if(!r.n)r.n="Neues Rezept";
  return r;
}

/* ---------- Allergene ---------- */
function allergenStatus(){
  return ALLERGENS.map(al=>{
    const E=state.diary.filter(d=>{const f=foodBy(d.f);return f&&f.a===al.k}).sort((a,b)=>b.d.localeCompare(a.d));
    const bad=E.some(d=>d.s&&d.s.some(s=>s!=="Blähungen"&&s!=="Verstopfung"));
    if(!E.length)return {...al,state:"new",n2:0};
    const days=daysSince(E[0].d);
    return {...al,state:bad?"bad":days>7?"due":"ok",days,n2:E.length};
  });
}

async function buildExport(){
  const photos={};
  for(const r of (state.recipes||[]))if(r.photo){const u=await loadPhoto(r.id);if(u)photos[r.id]=u}
  return {app:"beikost",v:1,exported:new Date().toISOString(),birth:state.birth,diary:state.diary,recipes:state.recipes||[],del:state.del||[],photos};
}
function mergeImport(o){
  if(!o||o.app!=="beikost")throw new Error("format");
  const del=new Set([...(state.del||[]),...(o.del||[])]);
  const diary=new Map();
  [...state.diary,...(o.diary||[])].forEach(d=>{if(d&&d.id&&!del.has(d.id)&&!diary.has(d.id))diary.set(d.id,d)});
  const newDiary=diary.size-state.diary.filter(d=>!del.has(d.id)).length;
  const recs=new Map();(state.recipes||[]).forEach(r=>recs.set(r.id,r));
  let newRec=0,updRec=0;
  (o.recipes||[]).forEach(r=>{
    if(!r||!r.id||del.has(r.id))return;
    const mine=recs.get(r.id);
    if(!mine){recs.set(r.id,r);newRec++;if(r.photo&&o.photos&&o.photos[r.id])savePhoto(r.id,o.photos[r.id])}
    else if((r.u||0)>(mine.u||0)){recs.set(r.id,r);updRec++;if(r.photo&&o.photos&&o.photos[r.id])savePhoto(r.id,o.photos[r.id]);else if(!r.photo)deletePhoto(r.id)}
  });
  [...recs.keys()].forEach(id=>{if(del.has(id)){recs.delete(id);deletePhoto(id)}});
  const removed=state.diary.filter(d=>del.has(d.id)).length;
  state.diary=[...diary.values()];state.recipes=[...recs.values()];state.del=[...del].slice(-2000);
  if(!state.birth&&o.birth)state.birth=o.birth;
  save();renderAll();
  return {newDiary,newRec,updRec,removed};
}

     <button class="btn ghost full" style="margin-top:8px" id="sTxtGo">Text übernehmen</button>
   </details>
   <div class="infobox">Danach das Gleiche in die andere Richtung, dann sind beide Handys auf demselben Stand. Die Datei ist gleichzeitig eine Sicherung – z. B. in „Dateien“ → iCloud Drive ablegen.</div>
   <button class="btn ghost full" style="margin-top:14px" id="closeS">Schließen</button>`);
  $("#closeS").onclick=closeSheet;
  buildExport().then(o=>{
    json=JSON.stringify(o);
    const name="beikost-abgleich-"+todayISO()+".json";
    file=new File([json],name,{type:"application/json"});
    const kb=Math.max(1,Math.round(json.length/1024));
    $("#sShare").disabled=false;$("#sShare").textContent="📤 Daten senden";
    $("#sInfo").textContent=`${o.diary.length} Tagebuch-Einträge, ${o.recipes.length} eigene Rezepte, ${Object.keys(o.photos).length} Fotos · ca. ${kb>1024?(kb/1024).toFixed(1)+" MB":kb+" KB"}`;
  });
  $("#sShare").onclick=async()=>{
    if(!file)return;
    // 1. iPhone-Teilen-Menü (AirDrop, WhatsApp, Nachrichten, Dateien)
    try{
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Beikost-Abgleich"});toast("Gesendet");return}
    }catch(e){if(e&&e.name==="AbortError")return}
    // 2. Als Datei speichern
    try{
      const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
      if(dl){await dl.save({filename:file.name,data:new Blob([json],{type:"application/json"})});toast("Datei gespeichert – jetzt aus „Dateien“ senden");return}
    }catch(e){if(e&&e.code==="declined")return}
    // 3. Als Text kopieren
    try{await navigator.clipboard.writeText(json);toast("Kopiert – jetzt per Nachricht senden")}
    catch(e){toast("Senden hier nicht möglich")}
  };
  const doImport=txt=>{
    try{
      const r=mergeImport(JSON.parse(txt));
      closeSheet();
      toast(`Übernommen: ${r.newDiary} Einträge, ${r.newRec+r.updRec} Rezepte${r.removed?`, ${r.removed} gelöscht`:""}`);
    }catch(e){toast("Das ist keine Abgleich-Datei der Beikost-App")}
  };
  $("#sFile").onchange=e=>{
    const f=e.target.files&&e.target.files[0];if(!f)return;
    const rd=new FileReader();rd.onload=()=>doImport(String(rd.result));rd.onerror=()=>toast("Datei konnte nicht gelesen werden");rd.readAsText(f);
    e.target.value="";
  };
  $("#sTxtGo").onclick=()=>{const t=$("#sTxt").value.trim();if(!t)return toast("Bitte zuerst den Text einsetzen");doImport(t)};
}

/* ---------- Mehr ---------- */

   <button class="menu" data-m="sos"><span>🆘</span><div>Erste Hilfe bei Verschlucken<small>Würgen oder Ersticken – was tun</small></div></button>
   <button class="menu" data-m="sync"><span>🔄</span><div>Mit anderem Handy abgleichen<small>Tagebuch & Rezepte teilen – ohne Internetdienst</small></div></button>
   <button class="menu" data-m="plan"><span>🗓️</span><div>Der Beikost-Fahrplan<small>Welcher Brei wann</small></div></button>
   <h2 class="sec">Einstellungen</h2>
   <div class="card stack">
     <label class="f" style="margin-top:0">Geburtsdatum des Babys</label>
     <input type="date" id="bIn" value="${esc(state.birth)}" max="${todayISO()}">
     <button class="btn full" id="bSave">Speichern</button>
   </div>
   <div class="card" style="margin-top:10px">
     <label class="f" style="margin-top:0">Darstellung</label>
     <div class="chips" id="thC">
       <button class="chip ${!state.theme?"on":""}" data-t="">Wie iPhone</button>
       <button class="chip ${state.theme==="light"?"on":""}" data-t="light">☀️ Hell</button>
       <button class="chip ${state.theme==="dark"?"on":""}" data-t="dark">🌙 Dunkel</button>
     </div>
   </div>
   <button class="btn warn full" style="margin-top:18px" id="wipe">Tagebuch komplett löschen</button>
   <p class="disc">Die Angaben sind Richtwerte nach gängigen Empfehlungen. Jedes Kind hat sein eigenes Tempo – im Zweifel Kinderarzt oder Hebamme fragen.</p>
   <p class="disc" style="margin-top:8px;font-weight:800">Version 2.1 · Offline · Stand 11.10.2026</p>`;
  el.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const m=b.dataset.m;if(m==="al")showAllergens();if(m==="sos")showSOS();if(m==="plan")showPlan();if(m==="sync")showSync()});
  $("#bSave").onclick=()=>{state.birth=$("#bIn").value;save();renderAll();toast("Gespeichert")};
  $("#thC").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;state.theme=b.dataset.t;applyTheme();save();renderMore()};
  $("#wipe").onclick=()=>{if(confirm("Wirklich alle Tagebuch-Einträge löschen? Das lässt sich nicht rückgängig machen.")){(state.del=state.del||[]).push(...state.diary.map(x=>x.id));state.diary=[];save();renderAll();toast("Tagebuch gelöscht")}};
}
function showPlan(){
  openSheet(`<div class="hd"><div class="em">🗓️</div><h2>Beikost-Fahrplan</h2></div>
   <p class="muted" style="margin-top:6px">Beikost beginnt je nach Reifezeichen zwischen Beginn des 5. und Beginn des 7. Lebensmonats. Stillen oder Flasche laufen weiter.</p>
   <ol class="big">
    <li><div><b>Mittagsbrei</b><br>Gemüse-Kartoffel-Fleisch-Brei. Mit Gemüse starten, nach ein paar Tagen Kartoffel, dann Fleisch. 1–2× pro Woche Fisch statt Fleisch.</div></li>
    <li><div><b>Abendbrei · ca. 1 Monat später</b><br>Milch-Getreide-Brei mit Vollmilch und etwas Obst.</div></li>
    <li><div><b>Nachmittagsbrei · wieder ca. 1 Monat später</b><br>Getreide-Obst-Brei ohne Milch. Jetzt Wasser aus Becher oder Glas anbieten.</div></li>
    <li><div><b>Familienkost · ab ca. 10 Monaten</b><br>Nach und nach am Familientisch mitessen, weich, stückig, ungesalzen.</div></li>
   </ol>
   <div class="infobox">Breifrei (Baby-led Weaning) oder gemischt geht genauso – die Lebensmittel-Seite zeigt zu jedem Lebensmittel die passende Form zum Selbstessen.</div>
   <button class="btn ghost full" style="margin-top:14px" id="closeS">Schließen</button>`);
  $("#closeS").onclick=closeSheet;
}

/* ---------- Start ---------- */
function renderAll(){skDefs();renderHome();renderFoods();renderRecipes();renderDiary();renderMore()}
renderAll();
